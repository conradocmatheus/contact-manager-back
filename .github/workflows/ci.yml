name: CI/CD

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and static analysis
        run: npm run lint

      - name: Generate dependency audit report
        run: npm audit --json > npm-audit.json || true

      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run tests with coverage thresholds
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-only-test-secret-not-used-in-production

      - name: Analyze with SonarCloud
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload build, coverage and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-${{ github.sha }}
          path: |
            coverage/
            npm-audit.json
          if-no-files-found: warn
          retention-days: 30

  container-security:
    name: Build and scan container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for security validation
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: contact-manager-back:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: contact-manager-back:ci-${{ github.sha }}
          format: json
          output: trivy-report.json
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Block fixable high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: contact-manager-back:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"
          skip-setup-trivy: true

  publish-image:
    name: Publish container image
    needs: container-security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and publish validated image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to AWS EC2
    needs: publish-image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          : "${AWS_ROLE_ARN:?Configure the AWS_ROLE_ARN production variable}"
          : "${AWS_REGION:?Configure the AWS_REGION production variable}"
          : "${EC2_SECURITY_GROUP_ID:?Configure the EC2_SECURITY_GROUP_ID production variable}"
          : "${EC2_HOST:?Configure the EC2_HOST production variable}"
          : "${EC2_USER:?Configure the EC2_USER production variable}"
          : "${PRODUCTION_URL:?Configure the PRODUCTION_URL production variable}"
          : "${EC2_SSH_PRIVATE_KEY:?Configure the EC2_SSH_PRIVATE_KEY production secret}"
          : "${EC2_KNOWN_HOSTS:?Configure the EC2_KNOWN_HOSTS production secret}"

      - name: Configure temporary AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "664106870581"
          role-session-name: contact-manager-${{ github.run_id }}

      - name: Discover runner public IPv4
        id: runner-ip
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS --retry 3 --retry-delay 2 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [[ ! "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid runner IPv4 address" >&2
            exit 1
          fi
          echo "cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"

      - name: Authorize temporary runner SSH access
        id: authorize-ssh
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
        run: |
          set -euo pipefail
          description="github-actions-${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ip_permissions="$(jq -cn \
            --arg cidr "$RUNNER_CIDR" \
            --arg description "$description" \
            '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr,Description:$description}]}]')"

          set +e
          response="$(aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --ip-permissions "$ip_permissions" \
            --output json 2>&1)"
          status=$?
          set -e

          if (( status != 0 )); then
            if grep -q 'InvalidPermission.Duplicate' <<<"$response"; then
              echo "SSH access already exists for this runner CIDR; this run will not remove it."
              exit 0
            fi
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

          rule_id="$(jq -r '.SecurityGroupRules[0].SecurityGroupRuleId // empty' <<<"$response")"
          if [[ ! "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_CIDR" || true
            echo "AWS created the SSH rule but did not return its rule ID" >&2
            exit 1
          fi
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/contact-manager
          chmod 600 ~/.ssh/contact-manager
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update containers on EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_DEPLOY_COMMAND: ${{ vars.EC2_DEPLOY_COMMAND }}
        run: |
          deploy_command="${EC2_DEPLOY_COMMAND:-/usr/bin/bash /home/ubuntu/contact-manager/contact-manager-back/deploy/update-containers.sh}"
          ssh -i ~/.ssh/contact-manager -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" "$deploy_command"

      - name: Verify public production health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          health_url="${PRODUCTION_URL%/}/api/health"
          for attempt in {1..12}; do
            response="$(curl -fsS --connect-timeout 5 --max-time 10 "$health_url" || true)"
            if grep -q '"status":"ok"' <<<"$response"; then
              echo "Production is healthy: $health_url"
              exit 0
            fi
            echo "Health check $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done
          echo "Production health check failed: $health_url" >&2
          exit 1

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/contact-manager

      - name: Revoke temporary runner SSH access
        if: always() && steps.authorize-ssh.outputs.rule_id != ''
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          SECURITY_GROUP_RULE_ID: ${{ steps.authorize-ssh.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SECURITY_GROUP_RULE_ID"
